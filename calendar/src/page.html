<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="Events from the rationality, EA, AI safety and philosophy groups in Munich, in one list.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" type="application/rss+xml" title="Rationality Munich: upcoming events" href="/calendar/rss.xml">
<link rel="alternate" type="application/atom+xml" title="Rationality Munich: upcoming events (Atom)" href="/calendar/feed.xml">
<link rel="alternate" type="text/calendar" title="Rationality Munich calendar" href="/calendar/feeds/acx+ea.ics">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Rationality Munich">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="Events from the rationality, EA, AI safety and philosophy groups in Munich, in one list.">
<meta property="og:url" content="{{canonical}}">
<style>
:root { --bg: #faf8f3; --text: #1d1d1b; --muted: #6b6a66; --line: #e2dfd6; --chip: #efece3; --chip-hover: #e5e1d5; --mark: #fff3c4; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg: #131412; --text: #ecebe6; --muted: #9a9993; --line: #2c2d2a; --chip: #22231f; --chip-hover: #2e302a; --mark: #3a3420; } }
html, body { margin: 0; background: var(--bg); color: var(--text); }
/* `hidden` must win over the display rules below (article is a grid), or the
   group switches hide nothing. */
[hidden] { display: none !important; }
body { font: 17px/1.5 ui-sans-serif, system-ui, sans-serif; padding: 0 16px; }
main { max-width: 680px; margin: 0 auto; padding: 8vh 0 64px; }
nav { margin-bottom: 32px; font-size: 15px; display: flex; justify-content: space-between; gap: 16px; }
a { color: inherit; text-underline-offset: 3px; }
h1 { font-size: clamp(28px, 7vw, 40px); font-weight: 600; margin: 0 0 8px; letter-spacing: -.01em; }
.lede { margin: 0 0 20px; color: var(--muted); }

.filters { margin: 0 0 12px; }
.filters .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 8px; }
.filters .more label { font-size: 13px; padding: 2px 10px; }
.filters .more summary { display: inline-block; font-size: 14px; color: var(--muted); cursor: pointer; margin: 0 0 8px; }
.filters .more summary:hover { color: var(--text); }
.filters .more summary::before { content: "+ "; }
.filters .more[open] summary::before { content: "− "; }
/* Each chip is the switch: filled when on, outlined and struck through when
   off. The checkbox stays for keyboards and screen readers, just unseen. */
.filters label { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border: 1px solid transparent; border-radius: 999px; background: var(--chip); font-size: 14px; cursor: pointer; user-select: none; }
.filters label:hover { background: var(--chip-hover); }
.filters label:has(input:not(:checked)) { background: none; border-color: var(--line); color: var(--muted); text-decoration: line-through; }
.filters label:has(input:focus-visible) { outline: 2px solid var(--text); outline-offset: 2px; }
.filters input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
.filters .n { color: var(--muted); }
.subscribe { margin: 0 0 8px; font-size: 15px; color: var(--muted); }
.subscribe a { color: var(--text); font-weight: 600; }
.subscribe a.rss { font-weight: 400; color: var(--muted); margin-left: 4px; }
code { font-size: 13px; overflow-wrap: anywhere; }

h2 { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 40px 0 0; }
article { display: grid; grid-template-columns: 64px 1fr; gap: 16px; padding: 20px 0; border-bottom: 1px solid var(--line); scroll-margin-top: 16px; }
article:target { background: var(--mark); border-radius: 8px; margin: 0 -8px; padding: 20px 8px; }
.date { text-align: center; line-height: 1.15; }
.date .wd { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.date .d { font-size: 28px; font-weight: 600; }
h3 { font-size: 19px; font-weight: 600; margin: 0 0 4px; line-height: 1.3; }
h3 a { text-decoration: none; }
h3 a:hover, h3 a:focus-visible { text-decoration: underline; }
.meta { color: var(--muted); font-size: 15px; margin: 0 0 8px; }
.text { margin: 0 0 10px; font-size: 16px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; font-size: 14px; }
.links a { display: inline-block; padding: 3px 10px; border-radius: 999px; background: var(--chip); text-decoration: none; }
.links a:hover, .links a:focus-visible { background: var(--chip-hover); }
/* Events organised only in a group chat have nothing to link to. */
.attend, .attend-form button { font: inherit; font-size: 14px; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; cursor: pointer; }
.attend:hover, .attend-form button:hover { color: var(--text); }
.attend-form { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; }
.attend-form input { width: 5em; font: inherit; color: var(--text); background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.attend-form .msg { color: var(--muted); }
.links .chat { display: inline-block; padding: 2px 9px; border: 1px dashed var(--line); border-radius: 999px; color: var(--muted); }
/* Add-to-calendar icons, beside the title. */
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.add { display: flex; gap: 6px; flex-shrink: 0; }
.add a { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); }
.add a:hover, .add a:focus-visible { color: var(--text); background: var(--chip); }
.empty { color: var(--muted); margin-top: 32px; }

/* Statistics */
.summary { font-size: 18px; margin: 8px 0 0; }
.caveat { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
table { border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; text-align: right; }
thead th { font-size: 13px; font-weight: 600; color: var(--muted); }
tbody th, tfoot th { text-align: left; font-weight: 600; }
tbody tr { border-top: 1px solid var(--line); }
tfoot tr { border-top: 2px solid var(--line); }
.years, .days { width: 100%; }
.total { font-weight: 600; }
.wide { width: 40%; }
.bar { display: block; height: 10px; border-radius: 5px; background: var(--chip); }
.bar span { display: block; height: 100%; border-radius: 5px; background: var(--muted); }
.scroll { overflow-x: auto; }
.months td, .months th { padding: 6px 4px; text-align: center; min-width: 30px; }
.months tbody th { text-align: left; }
.heat { border-radius: 4px; }
.heat.dark { color: var(--bg); font-weight: 600; }
.zero { color: var(--line); }

/* Comparison and chart. Emphasis form: months from the chosen one in ink,
   the year before in a recessive gray. */
:root { --accent: var(--text); --deemph: color-mix(in srgb, var(--muted) 45%, var(--bg)); }
.compare { margin: 12px 0; font-size: 15px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
.compare input[type=checkbox] { accent-color: var(--accent); margin: 0 4px 0 0; vertical-align: -2px; }
.compare input { font: inherit; color: var(--text); background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
.tiles { display: flex; flex-wrap: wrap; gap: 24px; margin: 8px 0 16px; }
.tile .label { font-size: 13px; color: var(--muted); }
.tile .value { font-size: 32px; font-weight: 600; line-height: 1.2; }
.tile .delta { font-size: 14px; color: var(--muted); }
.chart { position: relative; margin: 0; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 11px; }
.chart .bar { fill: var(--deemph); }
.chart .bar.on { fill: var(--accent); }
.chart .hit { fill: transparent; }
.chart .hit:hover + .bar, .chart .bar.hover { opacity: .75; }
.chart .trend { stroke: var(--muted); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.chart .trend.on { stroke: var(--accent); }
.chart .marker { stroke: var(--muted); stroke-width: 1; }
.chart .dot { fill: var(--accent); stroke: var(--bg); stroke-width: 2; }
.chart .dot:hover { r: 6; }
.chart .tip { position: absolute; pointer-events: none; background: var(--text); color: var(--bg); font-size: 13px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -100%); }
footer { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 15px; }
footer p { margin: 0 0 6px; }
/* Phones. Last, so it overrides the rules above. */
@media (max-width: 560px) {
  .wide { display: none; }
  article { grid-template-columns: 44px 1fr; gap: 12px; }
  .date .d { font-size: 24px; }
  .head { display: block; }
  .add { margin: 4px 0 6px; }
  .tile .value { font-size: 26px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
}
</style>
</head>
<body data-page="{{page}}">
<main>
<nav><a href="/">← Rationality Munich</a>{{nav}}</nav>
<h1>{{heading}}</h1>
<p class="lede">{{lede}}</p>
{{filters}}
{{subscribe}}
{{body}}
<p class="empty" id="none" hidden>Nothing from the groups you picked.</p>
<footer>
<p>Updated {{updated}}. Refreshed every hour.{{stale}}</p>
<p><a href="/">Home</a> · <a href="/privacy.html">Privacy</a> · <a href="/impressum.html">Impressum</a> · <a href="https://github.com/float3/rationality-munich">Source on GitHub</a></p>
</footer>
</main>
<script>
// Which groups to show lives in the address (?g=acx,ea), so a filtered view
// can be shared and nothing is stored on the visitor's device.
(() => {
  const form = document.getElementById("filters");
  if (!form) return;
  const boxes = [...form.querySelectorAll("input")];
  const all = boxes.map((b) => b.value);
  // What the server ticked: DEFAULT_GROUPS. Only a different choice goes in the URL.
  const defaults = boxes.filter((b) => b.defaultChecked).map((b) => b.value).join(",");
  const wanted = new URLSearchParams(location.search).get("g");
  if (wanted !== null) {
    const keep = wanted.split(",");
    boxes.forEach((b) => (b.checked = keep.includes(b.value)));
  }
  form.hidden = false;
  const more = form.querySelector(".more");
  if (more && more.querySelector("input:checked")) more.open = true;
  const page = document.body.dataset.page;

  // A link to an event that has since happened lands on the past page.
  const id = decodeURIComponent(location.hash.slice(1));
  if (page === "upcoming" && id && !document.getElementById(id)) {
    location.replace("/calendar/past/" + location.search + location.hash);
    return;
  }

  // "About how many came?", sent to rationality-attendance: for past events,
  // and for upcoming ones once they have started.
  if (page === "past" || page === "upcoming") {
    const now = Date.now();
    document.querySelectorAll("article").forEach((a) => {
      if (page === "upcoming" && !(Number(a.dataset.start) <= now)) return;
      const li = document.createElement("li");
      const label = page === "past" ? "How many came?" : "How many are here?";
      li.innerHTML = `<button type="button" class="attend">${label}</button>`;
      a.querySelector(".links").append(li);
    });
    document.addEventListener("click", (ev) => {
      const button = ev.target.closest(".attend");
      if (!button) return;
      const id = button.closest("article").id;
      const li = button.parentElement;
      li.innerHTML =
        '<form class="attend-form"><input type="number" min="1" max="1000" required aria-label="About how many people came" placeholder="about"> <button>Send</button> <span class="msg" role="status"></span></form>';
      const formEl = li.querySelector("form");
      formEl.querySelector("input").focus();
      formEl.addEventListener("submit", async (sub) => {
        sub.preventDefault();
        const n = formEl.querySelector("input").value;
        const msg = formEl.querySelector(".msg");
        try {
          const res = await fetch("/calendar/attend", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: "id=" + encodeURIComponent(id) + "&n=" + encodeURIComponent(n),
          });
          const data = await res.json();
          msg.textContent = data.message;
          if (data.ok) formEl.querySelectorAll("input, button").forEach((x) => (x.disabled = true));
        } catch {
          msg.textContent = "Could not send; please try later.";
        }
      });
    });
  }

  function list(on) {
    let shown = 0;
    document.querySelectorAll("section.month").forEach((month) => {
      let visible = 0;
      month.querySelectorAll("article").forEach((a) => {
        const hide = !a.dataset.groups.split(" ").some((g) => on.includes(g));
        a.hidden = hide;
        if (!hide) visible++;
      });
      month.hidden = visible === 0;
      shown += visible;
    });
    document.getElementById("none").hidden = shown > 0 || !document.querySelector("article");
    subscribe(on);
  }

  // Feeds exist for every combination of the main groups (data-combo) and for
  // each other group alone, so a mix needs one subscription per extra group.
  const combo = form.dataset.combo.split(" ");
  const nameOf = (g) => boxes.find((b) => b.value === g).dataset.name;
  const feedUrl = (f) => "rationality-munich.com/calendar/feeds/" + f + ".ics";
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  // For news readers: the LW/ACX and EA events, whatever is switched on.
  const RSS = '<a class="rss" href="/calendar/rss.xml">RSS</a>';
  function subscribe(on) {
    const box = document.getElementById("subscribe");
    box.hidden = on.length === 0;
    const core = on.filter((g) => combo.includes(g));
    const feeds = [];
    if (on.length === all.length) feeds.push(["everything", "all"]);
    else {
      if (core.length) feeds.push([core.map(nameOf).join(" + "), core.join("+")]);
      on.filter((g) => !combo.includes(g)).forEach((g) => feeds.push([nameOf(g), g]));
    }
    if (feeds.length === 1) {
      const url = feedUrl(feeds[0][1]);
      box.innerHTML = `<a href="webcal://${url}">Subscribe in your calendar app</a>, or add <code>https://${url}</code> by URL. ${RSS}`;
    } else {
      const links = feeds.map(([name, f]) => `<a href="webcal://${feedUrl(f)}">${esc(name)}</a>`).join(" · ");
      box.innerHTML = `Subscribe in your calendar app, one each: ${links}. ${RSS}`;
    }
  }

  // Mirrors shade(), bar() and summary() in stats.rs.
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const rows = JSON.parse(document.getElementById("stats-data")?.textContent || "[]");
  const max = (xs) => Math.max(1, ...xs);
  function setBar(tr, n, most) {
    tr.querySelector(".bar span").style.width = Math.floor((n * 100) / most) + "%";
  }
  // Events per month, the months since the chosen one against the twelve
  // before. Built here rather than in Rust because it follows the switches.
  const sinceBox = document.getElementById("since");
  // On: compare with the same months a year earlier, and fit the trend to
  // counts with the usual seasonal swing taken out.
  const seasonBox = document.getElementById("season");
  // rationality-munich.com went live on Thursday, 17 September 2026.
  const LAUNCH = new Date(2026, 8, 17);
  const DAY = 864e5;
  // Least squares: the slope and intercept of y over x.
  function fit(xs, ys) {
    const n = xs.length;
    const mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
    let sxy = 0, sxx = 0;
    xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) ** 2; });
    const slope = sxx ? sxy / sxx : 0;
    return [slope, my - slope * mx];
  }
  const monthIndex = (y, m) => y * 12 + m;
  const monthLabel = (i) => MONTHS[i % 12] + " " + Math.floor(i / 12);
  // Each calendar month's usual share of events, 1 being an average month:
  // from the complete years before this one, pulled towards 1 by one year's
  // worth of average months so that thin data cannot swing it far.
  function seasonIndex(events, thisYear) {
    const per = Array(12).fill(0);
    let firstYear = thisYear;
    events.forEach(([y, m]) => {
      if (y < thisYear) {
        per[m]++;
        firstYear = Math.min(firstYear, y);
      }
    });
    const years = thisYear - firstYear, total = per.reduce((a, b) => a + b, 0);
    if (years < 2 || !total) return Array(12).fill(1);
    const avg = total / (12 * years);
    return per.map((s) => (s + avg) / ((years + 1) * avg));
  }

  function chart(events) {
    const box = document.getElementById("chart");
    const tiles = document.getElementById("tiles");
    if (!box) return;
    const now = new Date();
    const current = monthIndex(now.getFullYear(), now.getMonth());
    const [sy, sm] = sinceBox.value.split("-").map(Number);
    const since = sy ? Math.min(monthIndex(sy, sm - 1), current) : current - 11;
    const first = since - 12;
    const counts = new Map();
    events.forEach(([y, m]) => {
      const i = monthIndex(y, m);
      counts.set(i, (counts.get(i) || 0) + 1);
    });
    const months = [];
    for (let i = first; i <= current; i++) months.push([i, counts.get(i) || 0]);

    // Complete months only: the current one is still filling up.
    const sum = (a, b) => months.filter(([i]) => i >= a && i < b).reduce((s, [, n]) => s + n, 0);
    const season = !!seasonBox?.checked;
    const full = current - since;
    const after = full > 0 ? sum(since, current) / full : null;
    // The same months a year earlier, or the twelve before.
    const before = season ? (full > 0 ? sum(since - 12, current - 12) / full : 0) : sum(first, since) / 12;
    const earlier = season ? "the same months a year earlier" : "the year before";
    const total = sum(since, current + 1);
    const fmt = (x) => (Math.round(x * 10) / 10).toLocaleString("en");
    let delta = "";
    if (after !== null && before > 0) {
      const pct = Math.round(((after - before) / before) * 100);
      delta = `${pct >= 0 ? "+" : "−"}${Math.abs(pct)}% on ${earlier} (${fmt(before)} a month)`;
    } else if (after !== null) delta = `none in ${earlier}`;
    // Since launch: a rate per 30 days, against the same days a year
    // earlier or the whole year before launch.
    const dated = events.map((r) => new Date(r[0], r[1], r[4]));
    const days = Math.max(1, (now - LAUNCH) / DAY);
    const sinceLaunch = dated.filter((d) => d >= LAUNCH).length;
    const rate = (sinceLaunch / days) * 30;
    const [from, to, span] = season
      ? [LAUNCH - 365 * DAY, now - 365 * DAY, days]
      : [LAUNCH - 365 * DAY, LAUNCH.getTime(), 365];
    const rateBefore = (dated.filter((d) => d >= from && d < to).length / span) * 30;
    const launchDelta = rateBefore
      ? `${rate >= rateBefore ? "+" : "−"}${Math.abs(Math.round(((rate - rateBefore) / rateBefore) * 100))}% on ${season ? "the same days a year earlier" : "the year before"} (${fmt(rateBefore)})`
      : "";
    tiles.innerHTML =
      `<div class="tile"><div class="label">Events a month since ${monthLabel(since)}</div>` +
      `<div class="value">${after === null ? "–" : fmt(after)}</div><div class="delta">${delta}</div></div>` +
      `<div class="tile"><div class="label">Events since ${monthLabel(since)}</div>` +
      `<div class="value">${total}</div><div class="delta">including this month so far</div></div>` +
      `<div class="tile"><div class="label">A month since the site went live</div>` +
      (days < 28
        ? `<div class="value">–</div><div class="delta">too early: ${Math.floor(days)} days so far</div></div>`
        : `<div class="value">${fmt(rate)}</div><div class="delta">${launchDelta}</div></div>`);

    // Column chart, sized to its box: columns at most 24px, a 2px gap, a 4px
    // rounded top, hairline grid.
    const width = Math.max(280, box.clientWidth);
    const height = 180, left = 28, bottom = 22, top = 8;
    const band = (width - left) / months.length;
    const bar = Math.max(2, Math.min(24, band - 2));
    const most = Math.max(1, ...months.map(([, n]) => n));
    const step = most <= 5 ? 1 : most <= 10 ? 2 : most <= 25 ? 5 : 10;
    const ceil = Math.ceil(most / step) * step;
    const y = (n) => top + (height - top - bottom) * (1 - n / ceil);
    let svg = `<svg viewBox="0 0 ${width} ${height}" height="${height}" role="img" aria-label="Events per month from ${monthLabel(first)} to ${monthLabel(current)}">`;
    for (let t = 0; t <= ceil; t += step) {
      svg += `<line class="grid" x1="${left}" x2="${width}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${left - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
    }
    months.forEach(([i, n], k) => {
      const x = left + k * band + (band - bar) / 2;
      const h = y(0) - y(n), r = Math.min(4, h, bar / 2);
      const d = n ? `M${x},${y(0)}V${y(n) + r}Q${x},${y(n)} ${x + r},${y(n)}H${x + bar - r}Q${x + bar},${y(n)} ${x + bar},${y(n) + r}V${y(0)}Z` : "";
      svg += `<rect class="hit" x="${left + k * band}" y="${top}" width="${band}" height="${height - top - bottom}" data-k="${k}"/>`;
      svg += `<path class="bar${i >= since ? " on" : ""}" d="${d}"/>`;
      if (i % 12 === 0 || k === 0) svg += `<text class="axis" x="${x + bar / 2}" y="${height - 6}" text-anchor="middle">${i % 12 === 0 ? Math.floor(i / 12) : MONTHS[i % 12]}</text>`;
    });
    // Trend: least squares over the monthly counts shown, with each month's
    // usual seasonal share divided out when adjusting.
    const index = season ? seasonIndex(events, now.getFullYear()) : Array(12).fill(1);
    const adjusted = months.map(([i, n]) => n / index[i % 12]);
    const [slope, icept] = fit(months.map((_, k) => k), adjusted);
    const xAt = (k) => left + k * band + band / 2;
    const yc = (v) => y(Math.max(0, Math.min(ceil, v)));
    svg += `<line class="trend" x1="${xAt(0)}" y1="${yc(icept)}" x2="${xAt(months.length - 1)}" y2="${yc(icept + slope * (months.length - 1))}"/>`;
    svg += `<text class="axis" x="${xAt(0)}" y="${yc(icept) - 6}">trend ${Math.abs(slope) < 0.05 ? "±0" : (slope > 0 ? "+" : "−") + fmt(Math.abs(slope))}/month${season ? ", season-adjusted" : ""}</text>`;
    // Launch marker, when the launch month is on the chart.
    const lk = monthIndex(LAUNCH.getFullYear(), LAUNCH.getMonth()) - first;
    if (lk >= 0 && lk < months.length) {
      const lx = left + lk * band + band * ((LAUNCH.getDate() - 1) / 30);
      svg += `<line class="marker" x1="${lx}" x2="${lx}" y1="${top}" y2="${y(0)}"/><text class="axis" x="${lx - 4}" y="${top + 10}" text-anchor="end">site live</text>`;
    }
    svg += "</svg>";
    box.querySelector("svg")?.remove();
    box.querySelector(".tip")?.remove();
    box.insertAdjacentHTML("afterbegin", svg + `<div class="tip" hidden></div>`);
    const tip = box.querySelector(".tip");
    box.querySelectorAll(".hit").forEach((hit) => {
      const [i, n] = months[+hit.dataset.k];
      const show = () => {
        const k = +hit.dataset.k;
        tip.textContent =
          `${monthLabel(i)}: ${n} ${n === 1 ? "event" : "events"}` +
          (season && index[i % 12] !== 1 ? ` (${fmt(adjusted[k])} season-adjusted)` : "");
        tip.style.left = `${(+hit.getAttribute("x") + band / 2) / width * 100}%`;
        tip.style.top = `${y(n)}px`;
        tip.hidden = false;
      };
      hit.addEventListener("mouseenter", show);
      hit.addEventListener("focus", show);
      hit.addEventListener("mouseleave", () => (tip.hidden = true));
    });
  }

  function attendance(events) {
    const box = document.getElementById("att-chart");
    const tiles = document.getElementById("att-tiles");
    if (!box) return;
    const pts = events
      .filter((r) => r[5] != null)
      .map((r) => [new Date(r[0], r[1], r[4]), r[5]])
      .sort((a, b) => a[0] - b[0]);
    box.querySelector("svg")?.remove();
    box.querySelector(".tip")?.remove();
    if (pts.length < 3) {
      tiles.innerHTML = `<p class="caveat">${pts.length ? "Only " + pts.length : "No"} events with reported attendance yet; the analysis starts at three.</p>`;
      return;
    }
    const fmt = (x) => (Math.round(x * 10) / 10).toLocaleString("en");
    const mean = (xs) => xs.reduce((a, b) => a + b, 0) / xs.length;
    const all = mean(pts.map((p) => p[1]));
    const before = pts.filter((p) => p[0] < LAUNCH).map((p) => p[1]);
    const after = pts.filter((p) => p[0] >= LAUNCH).map((p) => p[1]);
    // Trend in people per month, fitted over every reported event.
    const months = pts.map((p) => (p[0] - pts[0][0]) / (30 * DAY));
    const [slope] = fit(months, pts.map((p) => p[1]));
    let launch = "";
    if (before.length && after.length) {
      const pct = Math.round(((mean(after) - mean(before)) / mean(before)) * 100);
      launch = `${pct >= 0 ? "+" : "−"}${Math.abs(pct)}% on before (${fmt(mean(before))}, ${before.length} events)`;
    }
    tiles.innerHTML =
      `<div class="tile"><div class="label">Average attendance</div><div class="value">${fmt(all)}</div><div class="delta">${pts.length} events reported</div></div>` +
      (after.length ? `<div class="tile"><div class="label">Since the site went live</div><div class="value">${fmt(mean(after))}</div><div class="delta">${launch || after.length + " events"}</div></div>` : "") +
      (pts.length >= 5 ? `<div class="tile"><div class="label">Trend</div><div class="value">${Math.abs(slope) < 0.05 ? "±0" : (slope > 0 ? "+" : "−") + fmt(Math.abs(slope))}</div><div class="delta">people a month, least squares</div></div>` : "");

    // Dots per event, a 2px line for the average of the last five.
    const width = Math.max(280, box.clientWidth);
    const height = 180, left = 28, bottom = 22, top = 8, right = 8;
    const t0 = pts[0][0].getTime(), t1 = Math.max(pts[pts.length - 1][0].getTime(), t0 + DAY);
    const x = (d) => left + ((d - t0) / (t1 - t0)) * (width - left - right);
    const most = Math.max(...pts.map((p) => p[1]));
    const step = most <= 10 ? 2 : most <= 25 ? 5 : most <= 50 ? 10 : 20;
    const ceil = Math.ceil(most / step) * step;
    const y = (n) => top + (height - top - bottom) * (1 - n / ceil);
    let svg = `<svg viewBox="0 0 ${width} ${height}" height="${height}" role="img" aria-label="Reported attendance per event">`;
    for (let t = 0; t <= ceil; t += step) {
      svg += `<line class="grid" x1="${left}" x2="${width}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${left - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
    }
    const rolling = pts.map((_, i) => mean(pts.slice(Math.max(0, i - 4), i + 1).map((p) => p[1])));
    svg += `<polyline class="trend on" points="${pts.map((p, i) => x(p[0]) + "," + y(rolling[i])).join(" ")}"/>`;
    if (LAUNCH > t0 && LAUNCH < t1) {
      svg += `<line class="marker" x1="${x(LAUNCH)}" x2="${x(LAUNCH)}" y1="${top}" y2="${y(0)}"/><text class="axis" x="${x(LAUNCH) - 4}" y="${top + 10}" text-anchor="end">site live</text>`;
    }
    pts.forEach((p, i) => {
      svg += `<circle class="dot" cx="${x(p[0])}" cy="${y(p[1])}" r="4" data-i="${i}"/>`;
    });
    // Years along the bottom, or months when the reports span under a year.
    const span = t1 - t0;
    const ticks = [];
    for (let d = new Date(pts[0][0].getFullYear(), pts[0][0].getMonth() + 1, 1); d <= t1; d.setMonth(d.getMonth() + 1)) {
      if (span > 400 * DAY ? d.getMonth() === 0 : true) ticks.push(new Date(d));
    }
    const every = Math.ceil(ticks.length / 8);
    ticks.filter((_, i) => i % every === 0).forEach((d) => {
      const label = span > 400 * DAY ? d.getFullYear() : MONTHS[d.getMonth()];
      svg += `<text class="axis" x="${x(d)}" y="${height - 6}" text-anchor="middle">${label}</text>`;
    });
    svg += "</svg>";
    box.insertAdjacentHTML("afterbegin", svg + `<div class="tip" hidden></div>`);
    const tip = box.querySelector(".tip");
    box.querySelectorAll(".dot").forEach((dot) => {
      const [d, n] = pts[+dot.dataset.i];
      dot.addEventListener("mouseenter", () => {
        tip.textContent = `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}: about ${n}`;
        tip.style.left = `${(+dot.getAttribute("cx") / width) * 100}%`;
        tip.style.top = `${+dot.getAttribute("cy") - 8}px`;
        tip.hidden = false;
      });
      dot.addEventListener("mouseleave", () => (tip.hidden = true));
    });
  }

  function recount(on) {
    const events = rows.filter(([, , , groups]) => groups.some((g) => on.includes(g)));
    const count = (pred) => events.filter(pred).length;

    document.querySelectorAll("[data-g]").forEach((el) => (el.hidden = !on.includes(el.dataset.g)));
    const years = [...document.querySelectorAll(".years tbody tr")];
    const yearTotals = years.map((tr) => count(([y]) => y === +tr.dataset.y));
    years.forEach((tr, i) => {
      tr.querySelectorAll("td[data-g]").forEach((td) => {
        const g = td.dataset.g;
        td.textContent = count(([y, , , gs]) => y === +tr.dataset.y && gs.includes(g));
      });
      tr.querySelector(".total").textContent = yearTotals[i];
      setBar(tr, yearTotals[i], max(yearTotals));
    });
    const foot = document.querySelector('.years tfoot tr');
    foot.querySelectorAll("td[data-g]").forEach((td) => {
      td.textContent = count(([, , , gs]) => gs.includes(td.dataset.g));
    });
    foot.querySelector(".total").textContent = events.length;

    const cells = [...document.querySelectorAll(".months td[data-m]")];
    const months = cells.map((td) => count(([y, m]) => y === +td.dataset.y && m === +td.dataset.m));
    const most = max(months);
    cells.forEach((td, i) => {
      const n = months[i];
      const pct = 12 + Math.floor((n * 58) / most);
      td.textContent = n || "·";
      td.className = n ? "heat" + (pct > 40 ? " dark" : "") : "zero";
      td.style.background = n ? `color-mix(in srgb, var(--text) ${pct}%, transparent)` : "";
    });

    const days = [...document.querySelectorAll(".days tr")];
    const perDay = days.map((tr) => count(([, , wd]) => wd === +tr.dataset.wd));
    days.forEach((tr, i) => {
      tr.querySelector(".total").textContent = perDay[i];
      setBar(tr, perDay[i], max(perDay));
    });

    const first = events.length ? Math.min(...events.map(([y]) => y)) : null;
    let text = `<b>${events.length}</b> events since ${first ?? "the start"}.`;
    // Ties go to the later month, as with the tuple comparison in stats.rs.
    const key = (i) => [months[i], +cells[i].dataset.y, +cells[i].dataset.m];
    const later = (a, b) => { for (let k = 0; k < 3; k++) if (a[k] !== b[k]) return a[k] > b[k]; return false; };
    let best = -1;
    months.forEach((n, i) => {
      if (n > 0 && (best < 0 || later(key(i), key(best)))) best = i;
    });
    if (best >= 0) {
      const td = cells[best];
      text += ` The busiest month so far was ${MONTHS[+td.dataset.m]} ${td.dataset.y}, with ${months[best]}.`;
    }
    document.getElementById("summary").innerHTML = text;
    chart(events);
    attendance(events);
  }

  function apply() {
    const on = boxes.filter((b) => b.checked).map((b) => b.value);
    if (page === "stats") recount(on);
    else list(on);

    const params = new URLSearchParams();
    if (on.join(",") !== defaults) params.set("g", on.join(","));
    if (sinceBox && sinceBox.value !== sinceBox.defaultValue) params.set("since", sinceBox.value);
    if (seasonBox && !seasonBox.checked) params.set("season", "0");
    const query = params.toString() ? "?" + params.toString().replace(/%2C/g, ",") : "";
    history.replaceState(null, "", location.pathname + query + location.hash);
    document.querySelectorAll("[data-keep-filter]").forEach((a) => {
      a.search = query;
    });
  }
  form.addEventListener("change", apply);
  if (sinceBox) {
    const wantedSince = new URLSearchParams(location.search).get("since");
    if (wantedSince && /^\d{4}-\d{2}$/.test(wantedSince)) sinceBox.value = wantedSince;
    if (new URLSearchParams(location.search).get("season") === "0") seasonBox.checked = false;
    seasonBox.addEventListener("change", apply);
    document.getElementById("compare").hidden = false;
    sinceBox.addEventListener("change", apply);
    let resized;
    window.addEventListener("resize", () => {
      clearTimeout(resized);
      resized = setTimeout(apply, 150);
    });
  }
  apply();
  // Hidden events above the target shift it; scroll again once filtered.
  if (id) document.getElementById(id)?.scrollIntoView();
})();
</script>
</body>
</html>
