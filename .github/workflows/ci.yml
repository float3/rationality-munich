name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly as well: the calendar reads other sites, and one of them changing
  # its format should show up here rather than as an empty calendar.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calendar
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: calendar
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  nix:
    name: Nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Formatting
        run: nix run nixpkgs#alejandra -- --check .
      - name: Flake outputs evaluate
        run: nix flake check
      # What float3/nixos deploys; runs the tests again inside the sandbox.
      - name: Build the calendar
        run: nix build .#default -L

  html:
    name: HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: calendar
      # The generated pages are validated too, built from the live sources.
      # A source that is down only adds a note to the pages.
      - name: Build the calendar pages
        working-directory: calendar
        run: cargo run --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML
        run: >-
          npx --yes html-validate@9
          www/*.html
          calendar/out/site/index.html
          calendar/out/site/past/index.html
          calendar/out/site/stats/index.html
      - name: XML is well-formed
        run: |
          python3 - www/sitemap.xml www/favicon.svg calendar/out/site/feed.xml calendar/out/site/rss.xml <<'EOF'
          import sys, xml.dom.minidom
          for f in sys.argv[1:]:
              xml.dom.minidom.parse(f)
              print("ok", f)
          EOF
      - uses: cachix/install-nix-action@v31
      # Offline, laid out the way nginx serves it: the static pages link into
      # /calendar/, and the calendar to its own pages, anchors and files.
      - name: Links between the pages, calendar included
        run: |
          W="$RUNNER_TEMP/web"
          mkdir -p "$W"
          cp -r www/. "$W"
          cp -r calendar/out/site "$W/calendar"
          nix shell --inputs-from . nixpkgs#lychee -c lychee --offline --no-progress \
            --include-fragments --index-files index.html --root-dir "$W" \
            --remap "https://rationality-munich\.com/(.*) file://$W/\$1" \
            "$W"/*.html "$W"/sitemap.xml "$W"/robots.txt "$W"/calendar/feed.xml "$W"/calendar/rss.xml \
            "$W"/calendar/index.html "$W"/calendar/past/index.html "$W"/calendar/stats/index.html
      - name: Calendar files are well-formed
        run: |
          for f in calendar/out/site/feeds/*.ics calendar/out/site/e/*.ics; do
            head -1 "$f" | grep -q '^BEGIN:VCALENDAR' || { echo "$f: no VCALENDAR"; exit 1; }
            tail -1 "$f" | grep -q '^END:VCALENDAR' || { echo "$f: truncated"; exit 1; }
          done
          ls calendar/out/site/feeds

  # Links to other sites. Only CI can check these, since Nix builds have no
  # network; the weekly run catches links that rot between commits. Event
  # links in the calendar come fresh from the feeds and are not checked.
  links:
    name: Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # 403 and 429 pass: Substack and others refuse GitHub's servers
      # outright, dead page or not. A dead page is a 404 or 410, or a domain
      # that no longer resolves.
      - name: Links to other sites
        run: >-
          nix shell --inputs-from . nixpkgs#lychee -c lychee --no-progress
          --max-concurrency 8 --max-retries 3 --accept '200..=299,403,429'
          --root-dir "$PWD/www"
          --remap "https://rationality-munich\.com/(.*) file://$PWD/www/\$1"
          --exclude '/calendar'
          www/*.html www/sitemap.xml www/robots.txt www/.well-known/security.txt
          calendar/data/*.json README.md
      # A revoked or reset WhatsApp invite still answers 200, but its preview
      # has no group name.
      - name: WhatsApp invites are live
        run: |
          fail=0
          for url in $(grep -ohE 'https://chat\.whatsapp\.com/[A-Za-z0-9]+' www/*.html | sort -u); do
            title=$(curl -sL -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36' "$url" \
              | grep -oE '<meta property="og:title" content="[^"]*' | sed 's/.*content="//')
            if [ -z "$title" ]; then
              echo "::error::$url: invite revoked or reset"
              fail=1
            else
              echo "ok $url ($title)"
            fi
          done
          exit $fail
