name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly as well: the calendar reads other sites, and one of them changing
  # its format should show up here rather than as an empty calendar.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calendar
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: calendar
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  nix:
    name: Nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Formatting
        run: nix run nixpkgs#alejandra -- --check .
      - name: Flake outputs evaluate
        run: nix flake check
      # What float3/nixos deploys; runs the tests again inside the sandbox.
      - name: Build the calendar
        run: nix build .#default -L

  html:
    name: HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: calendar
      # The generated pages are validated too, built from the live sources.
      # A source that is down only adds a note to the pages.
      - name: Build the calendar pages
        working-directory: calendar
        run: cargo run --release
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate HTML
        run: >-
          npx --yes html-validate@9
          calendar/out/site/index.html
          calendar/out/site/past/index.html
          calendar/out/site/stats/index.html
          calendar/out/demo/index.html
          calendar/out/demo/404.html
          calendar/out/demo/*/index.html
          calendar/out/demo/events/*/index.html
      - name: XML is well-formed
        run: |
          python3 - calendar/out/site/feed.xml calendar/out/site/rss.xml \
            calendar/out/demo/sitemap.xml calendar/out/demo/favicon.svg <<'EOF'
          import sys, xml.dom.minidom
          for f in sys.argv[1:]:
              xml.dom.minidom.parse(f)
              print("ok", f)
          EOF
      - uses: cachix/install-nix-action@v31
      # Offline, laid out the way nginx serves it: the pages at the root, and
      # the calendar pages this design does not have yet under /calendar/.
      - name: Links between the pages
        run: |
          W="$RUNNER_TEMP/web"
          mkdir -p "$W"
          cp -r calendar/out/demo/. "$W"
          cp calendar/out/site/feed.xml calendar/out/site/rss.xml "$W/calendar/"
          cp -r calendar/out/site/past calendar/out/site/stats \
            calendar/out/site/e calendar/out/site/feeds "$W/calendar/"
          nix shell --inputs-from . nixpkgs#lychee -c lychee --offline --no-progress \
            --include-fragments --index-files index.html --root-dir "$W" \
            --remap "https://rationality-munich\.com/(.*) file://$W/\$1" \
            "$W"/index.html "$W"/404.html "$W"/*/index.html "$W"/events/*/index.html \
            "$W"/robots.txt "$W"/sitemap.xml "$W"/calendar/feed.xml "$W"/calendar/rss.xml \
            "$W"/calendar/past/index.html "$W"/calendar/stats/index.html
      - name: Calendar files are well-formed
        run: |
          for f in calendar/out/site/feeds/*.ics calendar/out/site/e/*.ics; do
            head -1 "$f" | grep -q '^BEGIN:VCALENDAR' || { echo "$f: no VCALENDAR"; exit 1; }
            tail -1 "$f" | grep -q '^END:VCALENDAR' || { echo "$f: truncated"; exit 1; }
          done
          ls calendar/out/site/feeds

  # Links to other sites. Only CI can check these, since Nix builds have no
  # network; the weekly run catches links that rot between commits. Event
  # links in the calendar come fresh from the feeds and are not checked.
  links:
    name: Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # 403 and 429 pass: Substack and others refuse GitHub's servers
      # outright, dead page or not. 502-504 pass too: a site that is down
      # for a while. A dead page is a 404 or 410, or a domain that no
      # longer resolves.
      - name: Links to other sites
        run: >-
          nix shell --inputs-from . nixpkgs#lychee -c lychee --no-progress
          --max-concurrency 8 --max-retries 3 --accept '200..=299,403,429,502..=504'
          --exclude '\{' --exclude '^/' --exclude '^webcal:'
          calendar/data/*.json calendar/src/demo/*.rs README.md
      # A revoked or reset WhatsApp invite still answers 200, but its preview
      # has no group name.
      - name: WhatsApp invites are live
        run: |
          fail=0
          for url in $(grep -ohE 'https://chat\.whatsapp\.com/[A-Za-z0-9]+' calendar/src/demo/groups.rs | sort -u); do
            title=$(curl -sL -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36' "$url" \
              | grep -oE '<meta property="og:title" content="[^"]*' | sed 's/.*content="//')
            if [ -z "$title" ]; then
              echo "::error::$url: invite revoked or reset"
              fail=1
            else
              echo "ok $url ($title)"
            fi
          done
          exit $fail
